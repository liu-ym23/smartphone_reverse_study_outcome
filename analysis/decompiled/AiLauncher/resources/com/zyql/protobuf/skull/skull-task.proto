
syntax = "proto3";
package com.zyql.protobuf.skull;


option java_multiple_files = true;
option java_package = "com.zyql.protobuf.skull";
option java_outer_classname = "SkullOuter";

// User
message User {
  string user_id = 1; // UUID
}

// Agent
message Agent {
  string id = 1; // AgentID
  string version = 2; // Version
  string name = 3;
  string description = 4;
}

// Tool
message Tool {
  string id = 1; // UUID
  string version = 2; // Version
  string name = 3;
  string description = 4;
  map<string, string> parameters = 5; // Schema
}

message Resource {
  string type = 1; // "text" | "image" | "audio" | "file"
  string title = 2;
  string content = 3;
  string uri = 4;
  string description = 5;
  string mime_type = 6;
  map<string, string> extra = 7; // Record<string, any>
}

message Message {
  string role = 1;
  string content = 2;
  repeated Resource resources = 3;
}

message TaskContext {
  string context_id = 1;
  string session_id = 2;
  map<string, string> meta = 3;
}

message TaskInput {
  TaskContext context = 1;
  Message message = 2;
}

message TaskOutput {
  Message message = 1;
  repeated Resource artifacts = 2;
}

message ToolCallParams {
  string params = 1;
}

message ToolCallResult {
  string result = 1;
}

message ToolCall {
  string call_id = 1; // UUID
  Tool tool = 2;
  ToolCallParams params = 3;
  ToolCallResult result = 4;
}

message AskInput {
  map<string, string> params = 1;
  Message message = 2;
}

message Handoff {
  Task task = 1;
}

message Interrupt {
  Message message = 1;
}

// Item
message Item {
  string item_id = 1; // UUID
  string task_id = 2; // UUID
  
  string status = 3; // "progress" | "completed" | "failed" | "cancelled"
  string type = 4; // "message" | "tool_call" | "ask_input" | "interrupt" | "handoff"
  
  // one of item data
  oneof data {
    Message message = 5;
    ToolCall tool_call = 6;
    AskInput ask_input = 7;
    Interrupt interrupt = 8;
    Handoff handoff = 9;
  }
}

// Task
message Task {
  string task_id = 1;
  string parent_task_id = 2;
  repeated string child_task_ids = 3;
  string origin_task_id = 4;
  
  // from_entity
  message From {
    User user = 5;
    Agent agent = 6;
  }
  User user = 7;
  Agent agent = 8;
  
  // 执行信息
  string status = 9; // "progress" | "completed" | "failed" | "cancelled" | "paused"
  string error = 10;
  TaskInput input = 11;
  TaskOutput output = 12;
  repeated Item execution = 13;

  map<string,string> meta_data = 103;
}

message MessageDelta {
  string delta = 1;
}

// Event
message Event {
  string event_id = 1;
  string type = 2; // "task.init" | "item.add" | "item.update" | "item.delta" | "item.done" | "task.done"
  
  oneof data {
    Task task = 3;
    Item item = 4;
    MessageDelta message_delta = 5;
  }

  string task_id = 101;

}

message Execution {
  repeated Item items = 1;
}
