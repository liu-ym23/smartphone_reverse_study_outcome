     Figma 把这一组导出成两个独立 SVG，这里按节点坐标合成到同一个 56×56 画布：
       · 手形    node 32061:34927  节点 (169.54, 275.92)，描边 1.75 外扩 0.875  → 组内 (11.666, 11.043)
