<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Game Lobby</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.container{text-align:center;padding:24px}
.avatar{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd86a 0%,#e9692e 60%,#a03c12 100%);margin:0 auto 20px;display:grid;place-items:center;box-shadow:0 0 40px rgba(233,105,46,.4);animation:pulse 2s ease-in-out infinite}
.avatar .face{font-size:2rem}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(233,105,46,.4)}50%{transform:scale(1.05);box-shadow:0 0 60px rgba(233,105,46,.6)}}

.state-badge{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);font-size:14px;margin-bottom:16px;transition:all .3s ease}
.state-badge.active{background:rgba(79,195,247,.2);border-color:rgba(79,195,247,.5)}

h1{font-size:1.4rem;font-weight:600;margin-bottom:8px;background:linear-gradient(90deg,#4fc3f7,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.85rem;opacity:.7;margin-bottom:24px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:280px;margin:0 auto}
.info-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;text-align:left}
.info-card .label{font-size:.7rem;text-transform:uppercase;opacity:.5;margin-bottom:4px}
.info-card .value{font-size:.95rem;font-weight:500}

.log{position:fixed;bottom:12px;left:12px;right:12px;max-height:80px;overflow-y:auto;font-size:.7rem;opacity:.6;font-family:monospace;background:rgba(0,0,0,.3);border-radius:8px;padding:8px}
</style>
</head>
<body>
<div class="container">
  <div class="avatar"><span class="face">(&#x00b4;&#x30fb;&#x03c9;&#x30fb;&#x0060;)</span></div>
  <div class="state-badge" id="stateBadge">idle</div>
  <h1>Game Lobby</h1>
  <p class="subtitle">Fullscreen HTML Takeover Demo</p>
  <div class="info-grid">
    <div class="info-card"><div class="label">State</div><div class="value" id="vState">idle</div></div>
    <div class="info-card"><div class="label">Emotion</div><div class="value" id="vEmotion">neutral</div></div>
    <div class="info-card"><div class="label">Weather</div><div class="value" id="vWeather">none</div></div>
    <div class="info-card"><div class="label">Night</div><div class="value" id="vNight">false</div></div>
  </div>
</div>
<div class="log" id="log"></div>

<script>
function log(msg) {
  var el = document.getElementById('log');
  var t = new Date().toLocaleTimeString();
  el.innerHTML += '<div>[' + t + '] ' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}

function onAgentUpdate(data) {
  var d = (typeof data === 'string') ? JSON.parse(data) : data;
  document.getElementById('vState').textContent = d.state || '-';
  document.getElementById('vEmotion').textContent = d.emotion || '-';
  document.getElementById('vWeather').textContent = d.weather || 'none';
  document.getElementById('vNight').textContent = String(d.nightMode);

  var badge = document.getElementById('stateBadge');
  badge.textContent = d.state;
  badge.classList.toggle('active', d.state !== 'idle');

  log('update: state=' + d.state + ' emotion=' + d.emotion);
}

window.onAgentUpdate = onAgentUpdate;
log('Game Lobby HTML loaded, waiting for SDK bridge...');

if (window.AgentBridge) {
  try {
    var snap = window.AgentBridge.getSnapshot();
    if (snap && snap !== '{}') onAgentUpdate(snap);
    log('Initial snapshot loaded via AgentBridge');
  } catch(e) { log('bridge error: ' + e.message); }
}
</script>
</body>
</html>
